id: no-sprintf-url-path
snapshots:
  ? |
    package main
    import "fmt"
    func main() {
      http.Post(fmt.Sprintf("%s/api/v1/sandboxes", base), "application/json", nil)
    }
  : labels:
    - source: fmt.Sprintf("%s/api/v1/sandboxes", base)
      style: primary
      start: 52
      end: 92
    - source: '"%s/api/v1/sandboxes"'
      style: secondary
      start: 64
      end: 85
  ? |
    package main
    import "fmt"
    func main() {
      u := fmt.Sprintf("%s/api/v1/sandboxes", base)
    }
  : labels:
    - source: fmt.Sprintf("%s/api/v1/sandboxes", base)
      style: primary
      start: 47
      end: 87
    - source: '"%s/api/v1/sandboxes"'
      style: secondary
      start: 59
      end: 80
  ? |
    package main
    import "fmt"
    func main() {
      u := fmt.Sprintf("%s/health", base)
    }
  : labels:
    - source: fmt.Sprintf("%s/health", base)
      style: primary
      start: 47
      end: 77
    - source: '"%s/health"'
      style: secondary
      start: 59
      end: 70
  ? |
    package main
    import "fmt"
    func main() {
      u := fmt.Sprintf("http://%s/path", host)
    }
  : labels:
    - source: fmt.Sprintf("http://%s/path", host)
      style: primary
      start: 47
      end: 82
    - source: '"http://%s/path"'
      style: secondary
      start: 59
      end: 75
