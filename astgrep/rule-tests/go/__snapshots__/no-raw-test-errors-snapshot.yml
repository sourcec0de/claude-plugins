id: no-raw-test-errors
snapshots:
  ? |
    package foo
    func TestFoo(t *testing.T) {
        t.Error("something failed")
    }
  : labels:
    - source: t.Error("something failed")
      style: primary
      start: 45
      end: 72
    - source: t
      style: secondary
      start: 45
      end: 46
    - source: Error
      style: secondary
      start: 47
