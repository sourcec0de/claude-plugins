id: ts-no-classname-constants
valid:
  - |
    const Card = ele.div('bg-white p-4')
  - |
    const Overlay = ele.div([
      'pointer-events-none absolute inset-y-0 right-2',
      'flex items-center gap-1 rounded-sm border',
    ])
  - |
    const Helper = ele.p.variant('mt-2 text-xs', {
      variants: { intent: { neutral: 'text-slate-700' } },
    })
  - |
    const SomeOtherConst = 'not a classes constant'
  - |
    const API_BASE_URL = 'https://api.example.com'
  - |
    const CONFIG_CLASSES_MAP = { primary: 'bg-primary' }
  - |
    const CLASSES_BY_VARIANT = getClassesMap()
invalid:
  - |
    const PLACEHOLDER_CLASSES = 'mr-2 flex items-center'
  - |
    const OVERLAY_CLASSES =
      'absolute inset-y-0 right-2 flex items-center gap-1'
  - |
    const STOCK_CLASSES = [
      'col-span-1 flex items-center',
      'text-sm text-slate-700',
    ]
  - |
    const LINK_CLASSES = `relative flex px-2 py-1`
