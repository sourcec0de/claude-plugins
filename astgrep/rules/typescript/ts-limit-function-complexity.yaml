id: ts-limit-function-complexity
language: tsx
severity: warning
message: >
  Logic should never be 3 levels deep, 2 at most. Consider extracting
  this nested logic into a separate function.
utils:
  control-flow:
    any:
      - kind: if_statement
      - kind: for_statement
      - kind: for_in_statement
      - kind: switch_statement
  function-boundary:
    any:
      - kind: function_declaration
      - kind: method_definition
      - kind: arrow_function
      - kind: function_expression
rule:
  matches: control-flow
  inside:
    matches: control-flow
    stopBy:
      matches: function-boundary
    inside:
      matches: control-flow
      stopBy:
        matches: function-boundary
