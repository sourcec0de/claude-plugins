      style: primary
      start: 0
      end: 39
    - source: npx
      style: secondary
      start: 0
      end: 3
    - source: npx
      style: secondary
      start: 0
      end: 3
    - source: '@ast-grep/cli'
      style: secondary
      start: 4
      end: 17
