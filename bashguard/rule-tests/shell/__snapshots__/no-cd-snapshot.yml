id: no-cd
snapshots:
  ? |
    cd /path && terraform plan
  : labels:
    - source: cd /path
      style: primary
      start: 0
      end: 8
    - source: cd
      style: secondary
      start: 0
      end: 2
    - source: cd
      style: secondary
      start: 0
      end: 2
  ? |
    cd /tmp
  : labels:
    - source: cd /tmp
      style: primary
      start: 0
      end: 7
    - source: cd
      style: secondary
      start: 0
      end: 2
    - source: cd
      style: secondary
      start: 0
      end: 2
  ? |
    cd src/infrastructure/terraform && terraform plan
  : labels:
    - source: cd src/infrastructure/terraform
      style: primary
      start: 0
      end: 31
    - source: cd
      style: secondary
      start: 0
      end: 2
    - source: cd
      style: secondary
      start: 0
      end: 2
